# Hiperparâmetros do modelo. Mudou aqui? O CI treina de novo e confere os limiares.
semente: 42

preprocessamento:
  log1p: true

validacao:
  n_splits: 5
  recall_selecao_minimo: 0.90
  grade_C: [0.1, 1.0, 10.0]
  pesos_classe_legitima: [1.0, 1.15, 1.25, 1.5]

modelo:
  C: 10.0
  max_iter: 3000
  # Penalizar mais o erro sobre mensagens legítimas protege a precisão de spam.
  class_weight: {0: 1.5, 1: 1.0}
